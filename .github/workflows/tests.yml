# Тесты плагинов до слияния (п. 8 страницы упрощения 27.10, metis-0571): на каждый PR в main — все tests/test_*.py
# guard, pantheon и project-tools на macOS и Python 3.14 тем же раннером, что и локально (scripts/run-tests.py).
# После слияния тик ставит выпуск без своего прогона тестов — поэтому красный прогон здесь и есть «не ставить».
# Права — только чтение; сторонних Action, кроме actions/checkout и actions/setup-python по полному SHA, нет.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Тесты guard, pantheon и project-tools
        run: |
          python3 --version
          python3 -I plugins/pantheon/scripts/run-tests.py -j 3 --log-dir "$RUNNER_TEMP/tests" \
            plugins/guard plugins/pantheon plugins/project-tools
