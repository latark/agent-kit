# Тесты плагинов (п. 8 страницы упрощения 27.10, metis-0571; полный набор на macOS на каждый PR — решение владельца
# 13.11, metis-1111). Гибрид без macOS (03.11, metis-0688) снят: репозиторий публичный, стандартные раннеры GitHub,
# включая macOS, для него бесплатны. Вернётся репозиторий в приватный (metis-1076) — вернуть гибрид: full только по
# workflow_dispatch на Linux и строку tests/full в OPTIONAL_CHECKS шлюза. На каждый PR в main два job:
#   - affected — лёгкая проверка на Linux: ruff, храповик, тесты скриптов выпуска (.github/scripts/test_release.py:
#     правка .github/ карту тестов плагинов не задевает) и затронутое (run-tests.py --affected по карте файл → тесты) на
#     ubuntu-24.04 (закреплён: у latest образ меняется под ногами), Python 3.14; файлы, которым нужен macOS, раннер на
#     Linux не гоняет, а печатает строкой «skip … пропущено» (SKIP_NOT_MAC); код 3 раннера «нечего гонять» — успех;
#   - full — полный набор трёх плагинов на macos-15 (закреплён), Python 3.14. Оба — обязательные проверки шлюза guard
#     (REQUIRED_CHECKS); локальный `pantheon outside test` — запасной путь, когда CI не запустился (README guard, п. 8).
# На push в main и по расписанию тесты не запускаются; ночной полный набор на main делает плановый проход.
# ruff (metis-0265) — первый шаг job affected, на каждый PR: правила — ruff.toml, версия и хеши колёс —
# .github/ruff-requirements.txt. Вторым шагом — храповик (metis-0854, plugins/pantheon/scripts/lint_ratchet.py):
# размер файлов, сложность функций и циклы импорта не растут против plugins/pantheon/scripts/lint-baseline.json
# (режим — plugins/pantheon/scripts/lint-ratchet-mode: warn — предупреждение с кодом 0, fail — отказ); ruff —
# с PATH, нет его — красный (run-tests.py зовёт храповик и сам, но без ruff пропускает). Не отдельным job: шлюз guard
# считает job на PR вне REQUIRED_CHECKS и OPTIONAL_CHECKS ошибкой (Д1 argus #235), а внутри affected красный ruff и
# так держит обязательную проверку.
# Права — только чтение; сторонних Action, кроме actions/checkout и actions/setup-python по полному SHA, нет.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # merge-base с origin/main нужен раннеру: на мелком клоне он гонит весь набор
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: ruff check (правила — ruff.toml, версия закреплена; metis-0265)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r .github/ruff-requirements.txt
          ruff check .
      - name: Храповик размера, сложности и импортов (база — plugins/pantheon/scripts/lint-baseline.json; metis-0854)
        run: python3 -I plugins/pantheon/scripts/lint_ratchet.py
      - name: Тесты скриптов выпуска
        run: python3 -I .github/scripts/test_release.py
      - name: Затронутые тесты guard, pantheon и project-tools
        run: |
          python3 --version
          code=0
          python3 -I plugins/pantheon/scripts/run-tests.py --affected --base origin/main -j 3 \
            --log-dir "$RUNNER_TEMP/tests" plugins/guard plugins/pantheon plugins/project-tools || code=$?
          if [ "$code" -eq 3 ]; then
            echo "нечего гонять: изменения не задевают тесты"
            code=0
          fi
          exit "$code"

  full:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: ruff для храповика в run-tests.py (без него lint_ratchet пропускается; версия и хеши — как в affected)
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/ruff-requirements.txt
      - name: Тесты guard, pantheon и project-tools
        run: |
          python3 --version
          python3 -I plugins/pantheon/scripts/run-tests.py -j 3 --log-dir "$RUNNER_TEMP/tests" \
            plugins/guard plugins/pantheon plugins/project-tools
