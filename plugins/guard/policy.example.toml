# Привилегии guard — образец. Рабочий файл: ~/.claude/pantheon/policy.toml (у каждого свой).
# Правит только metis-pantheon после «да» владельца в её сессии. Реестр направлений
# ~/ai/pantheon/directions.toml правит штаб, поэтому привилегий в нём нет: его правкой их не выдать.

# Куда ещё пишут все роли (кроме своего направления и временных папок).
always = ["~/.claude/agent-memory"]

# Координатор с привилегией: роль domain-coordinator, запущенная в одной из этих папок.
[coordinators]
mnemo-brain = ["~/ai/knowledge"]
metis-pantheon = ["~/projects/agent-kit", "~/projects/mac-setup", "~/projects/pixel-agents", "~/.claude"]

# Куда ещё пишет роль (правило domain).
[agent_extra]
prometheus = ["~/ai/knowledge"]
clio = ["~/ai/knowledge"]

# Личное (правило private, шаг 1.2 очереди): кто читает и пишет.
[private]
roles = ["hq", "chiron"]
coordinators = ["mnemo-brain"]
paths = ["~/ai/knowledge/me", "~/ai/knowledge/.git/git-crypt", "~/ai/pantheon/.git/git-crypt", "~/.local/state/pantheon/owner-log/zeus.md"]

# Куда ещё пишут команды в песочнице окна направления (SEC-19): только кэши своих инструментов внутри
# ~/.cache или ~/Library/Caches. Папки направления берутся из реестра, остальное закрыто.
[sandbox_write]
themis-sources = ["~/.cache/expert-corpus"]

# gh pr merge (правило push, metis-0038, guard 0.5.0): сливает главная сессия domain-coordinator в папках своего
# направления из domains.json. Защиты — папки [coordinators] metis-pantheon и их репозитории (git remote; клон
# agent-kit в другой папке — тоже защиты) — только Метида по «да» владельца в окне вопросов Зевса. Вопрос:
# «[metis-NNNN] Слить https://github.com/latark/agent-kit/pull/N?», слияние: gh pr merge N --subject
# "[metis-NNNN] …". Одно «да» — одно слияние: отметки использованных — в ~/.local/state/pantheon/merge-consent/.
# Без этого файла или без непустого списка metis-pantheon слияние закрыто всем. Подробно — README guard, раздел
# «Слияние PR».
#
# Совместимость: свои папки теперь берутся из domains.json, [merge] больше не нужен. Его папки по-прежнему
# добавляются к папкам направления (ключ — имя направления, значение — список).
[merge]
themis-sources = ["~/projects/expert-corpus", "~/projects/legal-watch"]

# Включение: новая схема слияния включается этой таблицей (даже пустой). Без неё — как в 0.4.7: свои папки сливают
# только направления из [merge]; режим защит и проверки сбоев действуют и без неё.
# Продукт для клиентов: направление → папки. guard пропускает слияние так же, как во внутреннем режиме, а в тексте
# отказа напоминает о большем: проверку talos, строку Зевсу «что ушло» и откат одной командой в STATUS guard
# проверить не может — это обязанность координатора.
[merge_client]
athena-brokerassistant = ["~/projects/brokerAssistantApp"]
hermes-alex = ["~/projects/alexbroker"]

# Чужой репозиторий в gh pr merge -R / --repo — только из этого списка (owner/repo на github.com) и только для
# координатора этого направления: сессия Фемиды стоит в legal-watch, а сливает и PR expert-corpus (themis-0015).
# У Метиды любой -R требует того же согласия, что и защиты (вопрос — с ссылкой на этот PR). -R на репозиторий
# защит — это слияние защит, даже если он есть в списке другого направления.
[merge_repos]
themis-sources = ["latark/expert-corpus"]

# Поштучное «да» владельца на слияние защит (metis-0049, guard 0.5.2). consent = false снимает только его: --subject
# "[metis-NNNN] …", запись в окне вопросов и отметки merge-consent/ не нужны. Остальные проверки остаются: защиты
# сливает только Метида или её лид, один номер PR, без --auto, -R только из [merge_repos], сбой — отказ.
# По умолчанию (нет таблицы или ключа, не булево false) «да» обязательно. Правит только Метида.
# [merge_protect]
# consent = false
