# Привилегии guard — образец. Рабочий файл: ~/.claude/pantheon/policy.toml (у каждого свой).
# Правит только metis-pantheon после «да» владельца в её сессии. Реестр направлений
# ~/ai/pantheon/directions.toml правит Пританей, поэтому привилегий в нём нет: его правкой их не выдать.

# Куда ещё пишут все роли (кроме своего направления и временных папок).
always = ["~/.claude/agent-memory"]

# Координатор с привилегией: роль domain-coordinator, запущенная в одной из этих папок.
[coordinators]
mnemo-brain = ["~/ai/knowledge"]
metis-pantheon = ["~/projects/agent-kit", "~/projects/mac-setup", "~/projects/pixel-agents", "~/.claude"]

# Куда ещё пишет роль (правило domain).
[agent_extra]
prometheus = ["~/ai/knowledge"]
clio = ["~/ai/knowledge"]

# Личное (правило private, шаг 1.2 очереди): кто читает и пишет.
[private]
roles = ["hq", "chiron"]
coordinators = ["mnemo-brain"]
paths = ["~/ai/knowledge/me", "~/ai/knowledge/.git/git-crypt", "~/ai/pantheon/.git/git-crypt", "~/.local/state/pantheon/owner-log/zeus.md"]

# Куда ещё пишут команды в песочнице окна направления (SEC-19): только кэши своих инструментов внутри
# ~/.cache или ~/Library/Caches. Папки направления берутся из реестра, остальное закрыто.
[sandbox_write]
themis-library = ["~/.cache/lecture-notes"]

# gh pr merge (правило push, metis-0038; шлюз слияния — P1-4, guard 0.5.4): сливает главная сессия domain-coordinator в
# папках своего направления из domains.json или её лид. Защиты — папки [coordinators] metis-pantheon и их
# репозитории (git remote; клон agent-kit в другой папке — тоже защиты) — только Метида или её лид. Везде действует
# шлюз слияния: gh pr merge N --match-head-commit <SHA>, где на этот SHA есть запись тестов (pantheon review test) и
# последнее «принять» от argus (pantheon review accept); для продукта — ещё talos и строка с откатом в alerts.md;
# PR, который задевает ядро защит (Д3), сливает только сам владелец. Поштучного «да» владельца нет, таблицу
# [merge_protect] guard больше не читает. Без этого файла или без непустого списка metis-pantheon слияние закрыто
# всем. Подробно — README guard, раздел «Слияние PR».
#
# Совместимость: свои папки теперь берутся из domains.json, [merge] больше не нужен. Его папки по-прежнему
# добавляются к папкам направления (ключ — имя направления, значение — список).
[merge]
themis-library = ["~/projects/lecture-notes", "~/projects/law-feed"]

# Включение: новая схема слияния включается этой таблицей (даже пустой). Без неё — как в 0.4.7: свои папки сливают
# только направления из [merge]; режим защит, шлюз слияния и проверки сбоев действуют и без неё.
# Продукт для клиентов: направление → папки. Сверх общего шлюз слияния требует запись talos на этот PR и SHA и строку
# в ~/ai/pantheon/alerts.md со ссылкой owner/repo#N и словом «откат» (pantheon alert).
[merge_client]
athena-shop = ["~/projects/shopKeeperApp"]
hermes-site = ["~/projects/sitebuilder"]

# PR продукта только из тестов сливается без talos (metis-0863): репозиторий → шаблоны тестов (регистр учитывается)
# и пути сборки. Раздела нет — talos нужен всегда. Условия и что остаётся вне правила — README guard, шлюз слияния п. 6.
# [merge_test_only."owner/shopKeeperApp"]
# tests = ["**/*.check.ts", "tests/**"]
# build = ["dist"]

# Репозитории, которые направление сливает (owner/repo на github.com) — и свои, и чужие через -R / --repo.
# С guard 0.5.4 строка нужна каждому сливающему направлению: без неё шлюз слияния закрывает слияние и без -R.
# Пример: сессия направления стоит в law-feed, а сливает и PR lecture-notes. -R на репозиторий защит — это
# слияние защит, даже если он есть в списке другого направления.
[merge_repos]
themis-library = ["latark/lecture-notes", "latark/law-feed"]
metis-pantheon = ["latark/agent-kit", "latark/tg-read"]
athena-shop = ["latark/shopKeeperApp"]
hermes-site = ["latark/sitebuilder"]

# Что закрыто окну Пританея (PANTHEON_ROLE=hq) — у каждого своё, в коде значений нет (metis-0182). Раздел нужен всегда,
# даже пустой: без него infra-check тревожит «в policy.toml нет раздела [hq]: Пританею ничего не закрыто».
#   closed_dirs — папки, которые песочница окна Пританея закрывает на чтение (выгрузки чужого текста, кэши источников):
#     пути с "~/" или абсолютные, например "~/projects/<репозиторий>/cache";
#   closed_collections — коллекции qmd, по которым Пританею искать нельзя (хук qmd-query), например "legal".
#     Коллекции папок проектов направлений (qmd.toml, domains.json) закрыты и без этого списка (metis-0778):
#     сюда — то, что вне проектов направлений (выгрузки, корпус в своей папке).
# Битое значение (не список строк) — ошибка: окно Пританея не пересобирается, qmd Пританею закрыт, infra-check тревожит.
[hq]
closed_dirs = []
closed_collections = []

# Имена корпуса для правила corpus-role (metis-0021): роли не пополняют корпус и не читают его ключи. Раздела или
# ключа нет — правило ничего не узнаёт. Битое значение (не список непустых строк) — ролям Bash закрыт с
# предупреждением, пока раздел не исправят.
#   commands — имя файла команды корпуса, без пути: сравнение по basename, так `corpus` закрывает и голый
#     `corpus`, и `.venv/bin/corpus`; запись с путём (`.venv/bin/corpus`) не совпадёт ни с чем;
#   modules — модули `python -m`, которые её запускают;
#   write_subcommands — подкоманды пополнения (add, stage…); чтение (search, show) остаётся открытым;
#   scripts — скрипты пополнения (*.py), их запуск закрыт;
#   keychain_prefixes — приставки служб Связки с ключами корпуса.
[corpus]
commands = []
modules = []
write_subcommands = []
scripts = []
keychain_prefixes = []
