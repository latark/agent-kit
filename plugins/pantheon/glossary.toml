# Словарь терминов Пантеона (решение владельца [zeus-terminology] 17.10; metis-0205).
# Правильное слово, запрещённые слова и regex-шаблоны (без учёта регистра) для tests/test_glossary.py.
# patterns = [] — правило для ролей и описаний PR, тест по нему не ищет.
# [[allow]]: file — путь от plugins/pantheon (или README.md репозитория), text — фрагмент строки, reason — почему можно.

[[term]]
right = "Пританей"
forbidden = ["штаб"]
patterns = ['\bштаб']
where = "роли, README, тревоги, сводка, доска, отказы guard"

[[term]]
right = "шлюз слияния (шлюз запуска, gate(kind))"
forbidden = ["запор", "гейт", "замок"]
patterns = ['\bзапор', '\bгейт', '\bзам(ок|ка|ком|ке)\b']
where = "README, отказы guard, pantheon review, ночной цикл, сводка, описания PR"

[[term]]
right = "запрет сна Mac"
forbidden = ["бодрость Mac"]
patterns = ['\bбодрост']
where = "awake.py, сводка"

[[term]]
right = "возобновление ждущих сессий"
forbidden = ["будильник ждущих"]
patterns = ['\bбудильник']
where = "awake.py, watch.py, тревоги"

[[term]]
right = "возобновление после недельного лимита"
forbidden = ["подъём после лимита"]
patterns = ['\bподъ[её]м после']
where = "awake.py"

[[term]]
right = "проверка личных следов"
forbidden = ["сторож личных следов"]
patterns = ['\bсторож']
where = "check-traces.py, CI"

[[term]]
right = "плановый проход"
forbidden = ["тик"]
patterns = ['\bтик(а|у|ом|е|и|ов|ами|ах)?\b']
where = "сводка, доска"

[[term]]
right = "передать задание, передал задание"
forbidden = ["толкать", "толчок", "толкнул", "подталкивать", "выталкивать"]
patterns = ['\bтолка', '\bтолчо?к', '\bтолчк', '\b(?:под|про|вы)?толкн', '\b(?:под|про|вы)талкива']
where = "watch.py, тревоги, описания PR"

[[term]]
right = "простаивающее окно"
forbidden = ["окно без дела"]
patterns = ['без дела']
where = "watch.py, сводка, PR"

[[term]]
right = "Claude Code сам перезапустил фоновую сессию, задания у неё нет"
forbidden = ["флот поднял без задания", "флот фоновых сессий"]
patterns = ['флот']
where = "watch.py, тревоги"

[[term]]
right = "ядро Пантеона (guard, тексты ролей и сборка прав окон; правка ядра Пантеона, права окна)"
forbidden = ["ядро окон", "ядро окна"]
patterns = ['\bядр\w*\s+(?:окон|окна|окну|окном|окне)\b']
where = "роли, README, сообщения Зевса, описания PR; решение владельца [zeus-term-core] 18.10"

[[term]]
right = "на доске: галочка, выбор"
forbidden = ["кнопка"]
patterns = ['кнопк']
where = "карточки, сообщения Зевса"

[[term]]
right = "синхронизировать пока не с кем"
forbidden = ["второй Mac", "другие Mac"]
patterns = ['втор(ой|ого|ом) Mac', 'други[ехм]и? Mac']
where = "карточки и сводка sync.sh, config-check.py"

[[term]]
right = "имя только в `коде` и с пояснением по-русски рядом"
forbidden = ["push-хук", "голые state=working", "status idle", "AUTOSTART_MAX"]
patterns = []
where = "описания PR, тексты для человека"

[[term]]
right = "мутант убит (killed: тесты его поймали), мутант выжил (survived: тесты прошли — в тестах дыра)"
forbidden = ["мутант красный", "мутант зелёный", "красный на мутанте", "мутация краснеет"]
patterns = ['мута(?:нт|ци)\w*(?:(?!убит|выжил)[^.;\n]){0,60}?(?:красн|зел[её]н)', '(?:красн|зел[её]н)\w*\s+на\s+(?:[^\s.;]+\s+){0,4}?мута(?:нт|ци)']
where = "роли, отчёты argus и разработчиков, описания PR; слово владельца 04.11 (metis-0785)"

# Значения, которые сверяет код или внешний sync.sh (~/.claude), — менять только вместе с ними, отдельной задачей.
[[allow]]
file = 'lib/quarantine.py'
text = 'Отправить на другие Mac'
reason = 'прежняя метка старых карточек sync: SYNC_ACT её принимает, ~/.claude/sync.sh принимает её же (стр. 121); новые карточки sync.sh выдаёт с вариантом «Отправить»'

[[allow]]
file = 'scripts/config-check.py'
text = 'Отправить на другие Mac'
reason = 'прежняя метка старых карточек sync (option и recommend): SYNC_ACT в lib/quarantine.py и ~/.claude/sync.sh (стр. 121) принимают её; менять только вместе с ними'

[[allow]]
file = "roles/hq.tmpl"
text = "слово «кнопка» в текстах для него не используешь"
reason = "правило роли называет запрещённое слово, чтобы Зевс его не писал"

[[allow]]
file = "roles/hq.tmpl"
text = "Задачи «только про второй Mac»"
reason = "Зевс узнаёт по этим словам текст чужой задачи; в тексте владельцу он их не пишет"

