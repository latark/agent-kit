# Линтер ловит ошибки, а не стиль (metis-0265). Форматтер не используется. Запуск: ruff check . (версия — в workflow tests).
target-version = "py314"
# Хуки запускает hooks/python.sh на 3.11+ (AGENTS.md): синтаксис 3.12+ там (type X = int, f-строки 3.12) краснеет.
per-file-target-version = { "plugins/*/hooks/**" = "py311" }

[lint]
select = ["F", "E9", "B", "PLE"]
ignore = [
    "B904",  # raise ... from: цепочка исключений в сообщении выхода нам не нужна, правка 12 мест без выигрыша
    "B905",  # zip(strict=): везде zip по заведомо равным спискам, шум
    "B007",  # неиспользуемая переменная цикла: стиль, а не ошибка
]

[lint.per-file-ignores]
# P — модуль pantheon, остальные имена — функции из __all__ модулей lib, которыми пользуется main() в pantheon.py:
# загрузчик pantheon._attach ставит их в глобальные имена файлов plugins/pantheon/lib/*.py до выполнения
# (см. шапку archive.py), ruff считает их неопределёнными. Только эта папка; guard и остальное под полной F821.
"plugins/pantheon/lib/*.py" = ["F821"]
# B023 (замыкание в цикле): проверены все 17 срабатываний, замыкание вызывается тут же в том же проходе цикла.
# По файлам, а не глобально: новая находка в другом месте должна краснеть.
".github/scripts/release.py" = ["B023"]
"plugins/guard/tests/test_merge_gate_ci.py" = ["B023"]  # части test_merge_gate.py (metis-1119)
"plugins/guard/tests/test_merge_gate_gh.py" = ["B023"]
"plugins/pantheon/scripts/baseline.py" = ["B023"]
"plugins/pantheon/scripts/effort.py" = ["B023"]
"plugins/pantheon/tests/test_owner_cap.py" = ["B023"]
"plugins/pantheon/tests/test_plugins_update.py" = ["B023"]
# Тесты проверяют разбор невидимых и двунаправленных символов — они в данных теста намеренно.
"plugins/pantheon/tests/test_board_text.py" = ["PLE2502"]
"plugins/pantheon/scripts/config-check.py" = ["PLE2502"]
