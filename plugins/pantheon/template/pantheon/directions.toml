# Реестр направлений Пантеона — один источник правды: какие у вас направления и кто за них отвечает.
# Правит только штаб по вашему слову. Из него `pantheon domains build` собирает данные для защиты (руками не править).
# Привилегий здесь нет: они лежат отдельно, в ~/.claude/pantheon/policy.toml.

[person]
# Коллекции qmd (локальный поиск по заметкам), которые доступны ролям. Пример: ["notes", "projects"]. Пусто — роли
# ищут только по файлам своей папки.
qmd_collections = []
# Браузер для сайтов, где нужен ваш вход (например "chrome"). Пусто — строки о таком браузере в описаниях ролей
# выпадают, роли работают только с отдельным браузером без входов.
browser = ""

# Направление — один проект или одна область дел. Пример (закомментирован; уберите «# », чтобы включить).
# name — имя сессии координатора; project — как проект называется на доске; folders — папки, куда направлению
# разрешено писать; leads — роли-исполнители; short — подпись в одну строку; does — что делает направление;
# does_not — граница с соседями; examples — 3–5 фраз, по которым штаб узнаёт направление; mark — значок проекта
# на доске (один-четыре знака без пробелов и разметки, например эмодзи; без поля — ⬜).
#
# [[direction]]
# name = "example-site"
# project = "Example Site"
# folders = ["~/projects/example-site"]
# leads = ["hephaestus"]
# short = "Пример: сайт"
# does = "Сайт: вёрстка, тексты, выкладка"
# does_not = "Рассылки и реклама — другое направление"
# examples = [
#   "поправь заголовок на главной",
#   "что осталось до запуска сайта",
# ]
# mark = "🟦"
