# Тесты плагинов (п. 8 страницы упрощения 27.10, metis-0571; минуты Actions — решение владельца 28.10, пачка metis-0381).
# Репозиторий приватный: минута macOS стоит как десять Linux, поэтому
#   - на каждый PR в main — только затронутое (run-tests.py --affected по карте файл → тесты), на ubuntu-24.04 (закреплён, как macos-15: у latest образ меняется под ногами), Python 3.14;
#     файлы, которым нужен macOS, раннер на Linux не гоняет, а печатает строкой «skip … пропущено» (SKIP_NOT_MAC),
#     команды macOS (ioreg, pmset, scutil) подменяет заглушками; код 3 раннера «нечего гонять» — успех;
#     В этом же job — тесты скриптов выпуска (.github/scripts/test_release.py): правка .github/ карту тестов плагинов не
#     задевает, а гонять её нужно;
#   - на push в main (после слияния) и вручную (workflow_dispatch) — полный набор на macos-15, как до этого; коммит
#     «выпуск: …» не гоняется: в нём только version и releases.json. Коммит GITHUB_TOKEN из release.yml этот workflow
#     и так не запускает; условие — для ручного выпуска по AGENTS.md п. 7 (его пушит человек).
# После слияния тик ставит выпуск без своего прогона тестов: красный прогон на main — сигнал откатывать, а не «не ставить».
# ruff (metis-0265) — первый шаг job affected, на каждый PR: правила — ruff.toml, версия и хеши колёс —
# .github/ruff-requirements.txt. Не отдельным job: шлюз guard считает job на PR вне REQUIRED_CHECKS и OPTIONAL_CHECKS
# ошибкой (Д1 argus #235), а внутри affected красный ruff и так держит обязательную проверку.
# Права — только чтение; сторонних Action, кроме actions/checkout и actions/setup-python по полному SHA, нет.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # merge-base с origin/main нужен раннеру: на мелком клоне он гонит весь набор
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: ruff check (правила — ruff.toml, версия закреплена; metis-0265)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r .github/ruff-requirements.txt
          ruff check .
      - name: Тесты скриптов выпуска
        run: python3 -I .github/scripts/test_release.py
      - name: Затронутые тесты guard, pantheon и project-tools
        run: |
          python3 --version
          code=0
          python3 -I plugins/pantheon/scripts/run-tests.py --affected --base origin/main -j 3 \
            --log-dir "$RUNNER_TEMP/tests" plugins/guard plugins/pantheon plugins/project-tools || code=$?
          if [ "$code" -eq 3 ]; then
            echo "нечего гонять: изменения не задевают тесты"
            code=0
          fi
          exit "$code"

  full:
    if: "github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message, 'выпуск: ')"
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Тесты guard, pantheon и project-tools
        run: |
          python3 --version
          python3 -I plugins/pantheon/scripts/run-tests.py -j 3 --log-dir "$RUNNER_TEMP/tests" \
            plugins/guard plugins/pantheon plugins/project-tools
