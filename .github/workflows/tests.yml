# Тесты плагинов (п. 8 страницы упрощения 27.10, metis-0571; гибрид без macOS — решение владельца 03.11, metis-0688).
# Квота Free — 2000 минут в месяц, минута macOS стоит как десять Linux: в ноябре она кончилась за 3 дня. Поэтому
#   - полный набор тестов на GitHub идёт только вручную (workflow_dispatch, job full, ubuntu-24.04, без macOS); обычно
#     его гоняют локально через `pantheon outside test` (запись FULL_TESTS на head PR, которую шлюз guard засчитывает
#     при слиянии — README guard, п. 8). Job full нужен шлюзу: OPTIONAL_CHECKS держит строку tests/full, на PR он SKIPPED;
#   - на каждый PR в main — только лёгкая проверка на Linux: затронутое (run-tests.py --affected по карте файл → тесты)
#     на ubuntu-24.04 (закреплён: у latest образ меняется под ногами), Python 3.14;
#     файлы, которым нужен macOS, раннер на Linux не гоняет, а печатает строкой «skip … пропущено» (SKIP_NOT_MAC),
#     команды macOS (ioreg, pmset, scutil) подменяет заглушками; код 3 раннера «нечего гонять» — успех;
#     В этом же job — тесты скриптов выпуска (.github/scripts/test_release.py): правка .github/ карту тестов плагинов не
#     задевает, а гонять её нужно;
#   - на push в main и по расписанию тесты не запускаются: прогона после слияния нет, красный main ловит
#     локальный полный набор.
# Права — только чтение; сторонних Action, кроме actions/checkout и actions/setup-python по полному SHA, нет.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # merge-base с origin/main нужен раннеру: на мелком клоне он гонит весь набор
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Тесты скриптов выпуска
        run: python3 -I .github/scripts/test_release.py
      - name: Затронутые тесты guard, pantheon и project-tools
        run: |
          python3 --version
          code=0
          python3 -I plugins/pantheon/scripts/run-tests.py --affected --base origin/main -j 3 \
            --log-dir "$RUNNER_TEMP/tests" plugins/guard plugins/pantheon plugins/project-tools || code=$?
          if [ "$code" -eq 3 ]; then
            echo "нечего гонять: изменения не задевают тесты"
            code=0
          fi
          exit "$code"

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Тесты guard, pantheon и project-tools
        run: |
          python3 --version
          python3 -I plugins/pantheon/scripts/run-tests.py -j 3 --log-dir "$RUNNER_TEMP/tests" \
            plugins/guard plugins/pantheon plugins/project-tools
