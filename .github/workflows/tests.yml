# Тесты плагинов (п. 8 страницы упрощения 27.10, metis-0571; полный набор на macOS на каждый PR — решение владельца
# 13.11, metis-1111). Гибрид без macOS (03.11, metis-0688) снят: репозиторий публичный, стандартные раннеры GitHub,
# включая macOS, для него бесплатны; репозиторий публичный насовсем (решение владельца 13.11). На каждый PR в main два
# набора, каждый — частями matrix на параллельных раннерах (run-tests.py --shard K/N, metis-1111: части делят выбор
# файлов жадно по весу из репозитория, без пересечений; вес — время файла на CI macOS из
# plugins/pantheon/scripts/shard-times.json, обновляет scripts/shard-times.py из `gh run view --log`, metis-1117):
#   - affected-shard (K/4) — затронутое (run-tests.py --affected по карте файл → тесты) на ubuntu-24.04 (закреплён:
#     у latest образ меняется под ногами), Python 3.14; файлы, которым нужен macOS, раннер на Linux не гоняет, а
#     печатает строкой «skip … пропущено» (SKIP_NOT_MAC, только в части 1); код 3 раннера «нечего гонять» — успех;
#   - affected — собирающий job с прежним именем: ruff, храповик, тесты скриптов выпуска (.github/scripts/test_release.py:
#     правка .github/ карту тестов плагинов не задевает), затем красный, если хоть одна часть не success;
#   - full-shard (K/3) — полный набор трёх плагинов на macos-15 (закреплён), Python 3.14; не больше трёх частей:
#     лимит macOS — 5 job сразу на все PR. До раннера ставится ruff, иначе храповик раннера (в части 1) пропускается;
#   - full — собирающий job с прежним именем (на Linux, без шагов тестов): красный, если хоть одна часть не success;
#   - revert-check — проверка «на откате» (metis-1176, решение владельца 14.11: argus не гоняет тесты на Mac): тесты,
#     добавленные или изменённые в PR, идут на исходниках merge-base (plugins/pantheon/scripts/revert_check.py); все
#     зелёные — красный «не ловит». Последняя строка вывода — «итог: <статус> — …», код выхода и аннотация по статусу:
#     ловит и пропуск (мерить нечего: нет исходников, тесты пропущены раннером или падают и на HEAD) — 0 (::notice);
#     не ловит — 1; сбой — 2; не мерили (исходники без тестов или не успели в --budget) — 3; прервано (job отменён) — 4
#     (все четыре — ::warning, проверка красная). Необязательная (OPTIONAL_CHECKS шлюза), класс находки argus берёт
#     из строки «итог:» (gh run view --log или аннотация).
# affected — обязательная проверка шлюза guard (REQUIRED_CHECKS), full — необязательная (OPTIONAL_CHECKS): полный набор
# слияние не держит (metis-1050, решение 09.11, подтверждено 13.11), красная — предупреждение. Части — в
# OPTIONAL_CHECKS: их итог держат собирающие job. Собирающие идут и при красной части (`!cancelled()`), а при отмене
# запуска — нет. `fail-fast: false`: красная часть не гасит соседние. Локальный `pantheon outside test` — запасной путь,
# когда CI не запустился (README guard, п. 8).
# Ночной полный набор на main (metis-1115, решение владельца 13.11: на Mac тесты agent-kit не идут) — этот же
# workflow по расписанию (schedule, 22:00 UTC, только ветка по умолчанию — main) и вручную (workflow_dispatch на
# main): на них идут только full-shard и full, affected — только на PR. Итог читает плановый проход
# (plugins/pantheon/lib/nightly_tick.py) через gh: красный — задача на упавший файл и тревога. На push тесты не идут.
# ruff (metis-0265) — первый шаг job affected, на каждый PR: правила — ruff.toml, версия и хеши колёс —
# .github/ruff-requirements.txt. Вторым шагом — храповик (metis-0854, plugins/pantheon/scripts/lint_ratchet.py):
# размер файлов, сложность функций и циклы импорта не растут против plugins/pantheon/scripts/lint-baseline.json
# (режим — plugins/pantheon/scripts/lint-ratchet-mode: warn — предупреждение с кодом 0, fail — отказ); ruff —
# с PATH, нет его — красный (run-tests.py зовёт храповик и сам, но без ruff пропускает). Не отдельным job: шлюз guard
# считает job на PR вне REQUIRED_CHECKS и OPTIONAL_CHECKS ошибкой (Д1 argus #235), а внутри affected красный ruff и
# так держит обязательную проверку.
# ${{ }} в run — только matrix.part и needs.<часть>.result: их пишет сам GitHub, а не автор PR.
# Права — только чтение; сторонних Action, кроме actions/checkout и actions/setup-python по полному SHA, нет.
name: tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected-shard:
    name: affected-shard (${{ matrix.part }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # merge-base с origin/main нужен раннеру: на мелком клоне он гонит весь набор
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Затронутые тесты guard, pantheon и project-tools — часть
        run: |
          python3 --version
          code=0
          python3 -I plugins/pantheon/scripts/run-tests.py --affected --base origin/main -j 3 --shard ${{ matrix.part }}/4 \
            --log-dir "$RUNNER_TEMP/tests" plugins/guard plugins/pantheon plugins/project-tools || code=$?
          if [ "$code" -eq 3 ]; then
            echo "нечего гонять: изменения не задевают тесты"
            code=0
          fi
          exit "$code"

  affected:
    needs: affected-shard
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: ruff check (правила — ruff.toml, версия закреплена; metis-0265)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r .github/ruff-requirements.txt
          ruff check .
      - name: Храповик размера, сложности и импортов (база — plugins/pantheon/scripts/lint-baseline.json; metis-0854)
        run: python3 -I plugins/pantheon/scripts/lint_ratchet.py
      - name: Тесты скриптов выпуска
        run: python3 -I .github/scripts/test_release.py
      - name: Итог частей affected-shard
        run: |
          result="${{ needs.affected-shard.result }}"
          if [ "$result" != success ]; then
            echo "части affected-shard: $result — нужна success у каждой"
            exit 1
          fi
          echo "части affected-shard: success"

  revert-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # merge-base с origin/main: копия дерева на нём
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Изменённые проверки PR на исходниках merge-base (metis-1176)
        run: python3 -I plugins/pantheon/scripts/revert_check.py --base origin/main

  full-shard:
    name: full-shard (${{ matrix.part }}/3)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: ruff для храповика в run-tests.py (без него lint_ratchet пропускается; версия и хеши — как в affected)
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/ruff-requirements.txt
      - name: Тесты guard, pantheon и project-tools — часть
        run: |
          python3 --version
          python3 -I plugins/pantheon/scripts/run-tests.py -j 3 --shard ${{ matrix.part }}/3 --log-dir "$RUNNER_TEMP/tests" \
            plugins/guard plugins/pantheon plugins/project-tools

  full:
    needs: full-shard
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Итог частей full-shard
        run: |
          result="${{ needs.full-shard.result }}"
          if [ "$result" != success ]; then
            echo "части full-shard: $result — нужна success у каждой"
            exit 1
          fi
          echo "части full-shard: success"
